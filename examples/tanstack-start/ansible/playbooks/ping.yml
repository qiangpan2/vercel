---
# 测试服务器 SSH 连通性
# 前端调用：点击 "Ping" 按钮
# 
# 使用方式：
#   ansible-playbook -i inventory/hosts.yml playbooks/ping.yml -e "target_machine=cse-ai-3"

- name: Test SSH connectivity
  hosts: "{{ target_machine | default('all') }}"
  gather_facts: no
  
  tasks:
    - name: Ping the machine via SSH
      ansible.builtin.ping:
      register: ping_result
      
    - name: Show success message
      ansible.builtin.debug:
        msg: "✅ {{ inventory_hostname }} ({{ ansible_host }}) is reachable via SSH"